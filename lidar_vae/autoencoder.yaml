apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidar-vae
  labels:
    app: lidar-vae
  annotations:
    # UPDATE THIS after building and mirroring the lidar_vae image to ECR.
    image: &image 577004484676.dkr.ecr.us-east-1.amazonaws.com/cache/ghcr.io/apoorv/lidar_vae:20260629-204829
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidar-vae
  template:
    metadata:
      labels:
        app: lidar-vae
    spec:
      nodeSelector:
          volt.com/remote-desktop-eligible: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kueue.x-k8s.io/dedicated
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: init-code
          image: *image
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              mkdir -p /code-pvc/ai-workloads
              cp -rT /workspace/ai-workloads/lidar_vae /code-pvc/ai-workloads/lidar_vae
          volumeMounts:
            - name: code
              mountPath: /code-pvc
      containers:
        - name: lidar-vae
          image: *image
          imagePullPolicy: Always
          workingDir: /workspace/ai-workloads/lidar_vae/autoencoder
          command: ["/bin/bash", "-c"]
          args:
            - |
              export PATH="/opt/lidar-vae-pixi/.pixi/envs/default/bin:$PATH"
              echo "Ready. Sleeping indefinitely for VS Code attachment..."
              sleep infinity
          env:
            - name: LIDAR_VAE_ROOT
              value: /workspace/ai-workloads/lidar_vae
            - name: PATH
              value: /usr/local/cuda-12.9/bin:/opt/lidar-vae-pixi/.pixi/envs/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: CUDA_VISIBLE_DEVICES
              value: "0,1,2,3"
            - name: PYTHONPATH
              value: /workspace/ai-workloads/lidar_vae/autoencoder:/workspace/ai-workloads/lidar_vae/jormungand:/workspace/ai-workloads/lidar_vae/third_party/OpenSceneFlow
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "140"
              nvidia.com/gpu: "4"
            limits:
              cpu: "140"
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: code
              mountPath: /workspace
            - name: checkpoints
              mountPath: /workspace/ai-workloads/lidar_vae/autoencoder/checkpoints
            - name: checkpoints
              mountPath: /workspace/ai-workloads/lidar_vae/autoencoder/pod_ckpt
            - name: data
              mountPath: /data/nuscenes
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: code
          persistentVolumeClaim:
            claimName: lidar-vae-code
        - name: checkpoints
          persistentVolumeClaim:
            claimName: lidar-vae-checkpoints
        - name: data
          persistentVolumeClaim:
            claimName: lidar-vae-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidar-vae-code
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidar-vae-checkpoints
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidar-vae-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Gi
