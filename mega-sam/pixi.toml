[workspace]
channels = ["conda-forge"]
name = "mega-sam"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
imageio-ffmpeg = "*"

[feature.mega-sam]
channels = ["pytorch", "nvidia", "conda-forge", "pyg", "main", "r", "msys2", "https://conda.anaconda.org/conda-forge", "https://conda.anaconda.org/pytorch", "https://conda.anaconda.org/xformers"]

[feature.mega-sam.activation]
env = { CUDA_HOME = "$PIXI_PROJECT_ROOT/.pixi/envs/default" }

[feature.mega-sam.dependencies]
python = "3.10.*"
pip = "*"
setuptools = "<70.0.0"
numpy = "1.26.3"
mkl = "<2024.1"
intel-openmp = "<2024.1"
pytorch = { version = "2.2.*", channel = "pytorch" }
torchvision = { version = "0.17.*", channel = "pytorch" }
pytorch-scatter = { version = "2.1.2", channel = "pyg" }
xformers = { version = ">=0.0.25", channel = "xformers" }
gxx_linux-64 = "12.*"        # Upgraded to support CUDA 12 compilation
cuda-nvcc = "12.1.*"         # Upgraded for H100 support
cuda-toolkit = { version = "12.1.*", channel = "nvidia" } # Upgraded for H100 support
cuda-cccl = { version = "12.1.*", channel = "nvidia" }

[feature.mega-sam.pypi-dependencies]
opencv-python-headless = "==4.9.0.80"
tqdm = "==4.67.1"
imageio = "==2.36.0"
imageio-ffmpeg = "*"
einops = "==0.8.0"
scipy = "==1.14.1"
matplotlib = "==3.9.2"
wandb = "==0.18.7"
timm = "==1.0.7"
ninja = "==1.11.1"
huggingface-hub = "==0.23.4"
kornia = "==0.7.4"
viser = "*"

[environments]
default= { features = ["mega-sam"], no-default-feature = true }
